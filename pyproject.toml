[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidequest"
version = "0.1.0"
description = "Cut Claude Code token costs by delegating bulk LLM work to cheap models. 600+ models via NanoGPT, OpenRouter, Groq or Ollama, batched and resumable, with real per-call cost tracking."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jeff Tseng" }]
keywords = [
    # ordered roughly by researched search volume
    "claude-code", "openrouter", "claude-code-skills", "claude-code-plugin",
    "claude-code-agents", "claude-code-cost", "llm-gateway", "nanogpt",
    "llm-proxy", "openai-compatible", "cheap-llm-api", "llm-cost",
    "token-cost", "groq", "ollama", "deepseek", "cerebras",
    "batch-processing", "llm-classification", "data-labeling", "cli", "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bicced/sidequest"
Documentation = "https://github.com/bicced/sidequest#readme"
Issues = "https://github.com/bicced/sidequest/issues"

[project.scripts]
sidequest = "sidequest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sidequest"]
