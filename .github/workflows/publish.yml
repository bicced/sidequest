name: publish

# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token
# stored in this repository. Configure the trusted publisher once at
# https://pypi.org/manage/project/sidequest/settings/publishing/ with:
#   owner: bicced   repo: sidequest   workflow: publish.yml
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests must pass before anything is published
        run: python -m unittest discover -s tests

      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
